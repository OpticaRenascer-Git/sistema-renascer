<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sistema Renascer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --brand:#E8620F; --brand-ink:#B8470A; --sun:#F9B208; --bg:#FBF8F5; --surface:#FFFFFF; --sunk:#F3EEE9;
  --line:#E6DDD4; --fg:#2A221D; --muted:#6F625A; --ok:#1E7F4F; --ok-bg:#E3F4EA; --warn:#9A5B00; --warn-bg:#FFF1D6; --bad:#B42318; --bad-bg:#FDE7E5;
  --on-brand:#FFFFFF;
  --f-display:"Outfit",system-ui,sans-serif; --f-body:"Nunito Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#FF8A3D; --brand-ink:#FFB27A; --sun:#FFC845; --bg:#1A1512; --surface:#241D19; --sunk:#2E2621; --line:#3D332C; --fg:#F3ECE6; --muted:#B5A79C;
  --ok:#5BD69A; --ok-bg:#16352A; --warn:#FFC266; --warn-bg:#3A2C12; --bad:#FF8A80; --bad-bg:#3D1C1A; --on-brand:#1A1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#FF8A3D; --brand-ink:#FFB27A; --sun:#FFC845; --bg:#1A1512; --surface:#241D19; --sunk:#2E2621; --line:#3D332C; --fg:#F3ECE6; --muted:#B5A79C;
  --ok:#5BD69A; --ok-bg:#16352A; --warn:#FFC266; --warn-bg:#3A2C12; --bad:#FF8A80; --bad-bg:#3D1C1A; --on-brand:#1A1512; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
header.top img{height:46px;width:auto}
.proto{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:4px 12px;font-weight:600}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:22px} h3{font-size:16px}
.steps{display:flex;gap:6px;margin:18px 0 16px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);background:var(--sunk);color:var(--muted);font-weight:600;border:0;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface);font-family:var(--f-display);font-size:13px}
.step.on{background:var(--brand);color:var(--on-brand)} .step.on b{background:var(--on-brand);color:var(--brand)}
.step.done b{background:var(--ok);color:#fff}
.step:disabled{cursor:not-allowed;opacity:.55}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hint{color:var(--muted);font-size:13.5px;margin:0}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{font:inherit;font-weight:700;border-radius:9px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand-ink);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:var(--fg);cursor:pointer}
.pick:hover{border-color:var(--brand)}
.pick.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.pick small{color:var(--muted);display:block}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.brand{background:var(--sunk);color:var(--brand-ink)}
.msg{border-radius:10px;padding:10px 14px;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.bad{background:var(--bad-bg);color:var(--bad)}
.rx{overflow-x:auto}
.rx table{border-collapse:collapse;width:100%;min-width:560px}
.rx th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 4px;text-align:center}
.rx td{padding:4px}
.rx td:first-child{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--brand-ink);width:48px;text-align:center}
.rx input{text-align:center;font-family:var(--f-mono);padding:8px 4px}
.rx input.err{border-color:var(--bad);background:var(--bad-bg)}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.pay button{font:inherit;font-weight:700;padding:16px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.pay button svg{width:26px;height:26px;stroke:var(--brand);fill:none;stroke-width:1.8}
.pay button.sel{border-color:var(--brand);background:var(--sunk);box-shadow:inset 0 0 0 1px var(--brand)}
.inst{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.inst button{font:inherit;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;text-align:center}
.inst button b{display:block;font-family:var(--f-display)} .inst button small{color:var(--muted);font-size:12px}
.inst button.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
aside.sum{position:sticky;top:12px}
.sum .line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sum .total{font-family:var(--f-display);font-size:28px;font-weight:700}
.sum .rest{font-family:var(--f-display);font-size:20px;font-weight:700}
.divider{height:1px;background:var(--line)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.doc{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;font:inherit;color:var(--fg);cursor:pointer}
.doc:hover,.doc.sel{border-color:var(--brand)}
.doc b{font-family:var(--f-display);font-size:16px}
.doc span{color:var(--muted);font-size:13px}
.paper{overflow-x:auto;min-width:0;background:#fff;color:#1d1916;border-radius:6px;padding:22px;border:1px dashed #cbbfb4;font-size:13.5px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.paper img{height:40px;width:auto;align-self:flex-start}
.paper h4{margin:0;font-family:var(--f-display);font-size:18px}
.paper table{border-collapse:collapse;width:100%}
.paper th,.paper td{border:1px solid #d8cec5;padding:5px 6px;text-align:center;font-size:12.5px}
.paper th{background:#f6f1ec}
.paper .os{font-family:var(--f-mono);font-size:20px;color:#B8470A}
.paper .sig{margin-top:22px;border-top:1px solid #1d1916;padding-top:4px;text-align:center;font-size:12px;width:70%;align-self:center}
.paper .fine{font-size:11.5px;color:#5e534b}
.note{font-size:12.5px;color:var(--muted);text-align:center}
.inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline > label{flex:1 1 160px}
.mono{font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<style>
.tabs{display:flex;gap:6px;margin:18px 0 16px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 auto;padding:10px 16px;border-radius:var(--r);background:var(--sunk);color:var(--muted);border:0;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--brand);color:var(--on-brand)}
.who{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.who select{width:auto;padding:6px 10px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
@media (max-width:480px){.kpi b{font-size:18px}}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:700}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--muted)}
.count{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:700;font-family:var(--f-display)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.admgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lock{font-size:12px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;color:var(--fg);font-size:14px;flex-direction:row}
.switch input{width:auto}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
</style>
<style>
.login{max-width:420px;margin:8vh auto 0}
.login .panel{gap:14px}
.empty{color:var(--muted);font-size:14px}
.spin{color:var(--muted);font-size:14px;padding:8px 0}
.err{color:var(--bad);font-weight:600;font-size:13px}
</style>
</head><body>
